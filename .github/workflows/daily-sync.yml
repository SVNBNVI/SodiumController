name: Daily Sodium Sync

on:
  schedule:
    # Runs at 08:00 UTC (4:00 AM EDT/EST) every day
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual one-click runs from GitHub dashboard

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Scraper
        run: node sync-sodium.js

      - name: Commit and Push Updated Sodium Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sodium-today.json
          git diff --staged --quiet || (git commit -m "SodiumController auto-sync: $(date +'%Y-%m-%d')" && git pull --rebase && git push)